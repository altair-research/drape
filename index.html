<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="카메라에 비친 얼굴에 사계절 드레이프 색을 대보는 퍼스널컬러 미러">
<title>Personal Color Mirror</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D0D0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Color Mirror">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<style>
  :root{
    --ink:#0D0D0F;
    --ink-2:#161619;
    --fg:#F3F2EF;
    --fg-dim:#9B99A2;
    --line:rgba(255,255,255,.14);
    --line-strong:rgba(255,255,255,.32);
    --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic",system-ui,sans-serif;
    --serif:var(--sans);
    --mono:var(--sans);
    --drape:#FF7F6E;
    --drape-top:52%;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--ink);
    color:var(--fg);
    font-family:var(--sans);
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  .app{
    position:relative;
    width:100%;
    height:100dvh;
    min-height:520px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:var(--ink);
  }

  /* ---------- stage: camera + drape ---------- */
  .stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--ink-2);touch-action:pan-y;
    margin:max(8px,env(safe-area-inset-top)) 8px 0;border-radius:24px;isolation:isolate}
  #cam,#shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  #cam{transform:scaleX(-1)}
  #cam.rear{transform:none}
  #shot{display:none}
  .stage.photo #cam{display:none}
  .stage.photo #shot{display:block}

  .drape{
    position:absolute;left:0;right:0;top:var(--drape-top);bottom:0;
    display:flex;flex-direction:column;
    filter:drop-shadow(0 -14px 22px rgba(0,0,0,.45));
    z-index:2;
  }
  .drape .neck{display:block;width:100%;height:76px;flex:none}
  .drape .neck path{fill:var(--drape)}
  .drape .body{flex:1;background:var(--drape);min-height:0}

  .handle{
    position:absolute;left:50%;top:calc(var(--drape-top) + 46px);
    transform:translateX(-50%);
    z-index:4;
    width:104px;height:34px;
    display:flex;align-items:center;justify-content:center;
    border:0;padding:0;background:none;cursor:grab;
    touch-action:none;
  }
  .handle:active{cursor:grabbing}
  .handle span{
    width:44px;height:4px;border-radius:2px;
    background:rgba(255,255,255,.55);
    box-shadow:0 0 0 1px rgba(0,0,0,.25);
  }

  .guide{
    position:absolute;left:50%;top:20%;transform:translateX(-50%);
    width:min(56vw,240px);aspect-ratio:3/4;
    border:1px dashed var(--line-strong);
    border-radius:50%;
    z-index:3;pointer-events:none;
    transition:opacity .25s ease;
  }
  .guide.off{opacity:0}

  /* ---------- readout ---------- */
  .readout{
    position:absolute;top:0;left:0;right:0;z-index:5;
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
    padding:16px 18px 40px;
    background:linear-gradient(to bottom,rgba(0,0,0,.62),rgba(0,0,0,0));
    pointer-events:none;
  }
  .readout .name{font-family:var(--sans);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:-.03em}
  .readout .season{
    margin-top:5px;font-size:11.5px;letter-spacing:.02em;
    color:var(--fg-dim);
  }
  .readout .meta{text-align:right;font-family:var(--sans);font-size:12px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .readout .match{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--fg-dim);display:flex;align-items:baseline;justify-content:flex-end;gap:6px}
  .readout .match b{font-weight:500;font-size:22px;color:var(--fg);letter-spacing:-.02em;min-width:2.4em;text-align:right}
  .readout .match.na b{color:var(--fg-dim)}
  .readout .match[hidden]{display:none}
  #cHex,#compare .num{display:none}
  #flipBtn{display:none}
  .readout .flip{
    pointer-events:auto;appearance:none;cursor:pointer;
    width:36px;height:36px;padding:0;display:grid;place-items:center;
    background:rgba(0,0,0,.42);color:var(--fg);border:1px solid var(--line);border-radius:50%;
    backdrop-filter:blur(6px);opacity:.85;
  }
  .readout .flip svg{width:18px;height:18px}
  .readout .flip[hidden]{display:none}
  .readout .flip:active{transform:scale(.97)}
  /* ---------- 담은 색끼리 비교 모드 ---------- */
  .keptbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:0 14px;font-size:13px;color:var(--fg-dim);
  }
  .keptbar[hidden]{display:none}
  .keptbar b{font-weight:500;color:var(--fg)}
  .keptbar .btn{padding:7px 11px;font-size:12px}
  #keptStrip[hidden],#tabs[hidden],#strip[hidden]{display:none}
  .console.kept{border-top:1px solid rgba(255,255,255,.14)}
  .empty-kept{padding:6px 14px;font-size:13px;color:var(--fg-dim)}

  /* ---------- 더보기 메뉴 ---------- */
  .menu .rows{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .mrow{
    appearance:none;cursor:pointer;width:100%;text-align:left;
    background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:12px;
    font-family:var(--sans);font-size:14px;padding:13px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    text-decoration:none;
  }
  .mrow[hidden]{display:none}
  .mrow .state{font-size:12px;color:var(--fg-dim)}
  .mrow[aria-pressed="true"]{border-color:var(--fg)}
  .mrow[aria-pressed="true"] .state{color:var(--fg)}
  .menu .ver{margin-top:14px;font-size:11px;color:rgba(255,255,255,.38);letter-spacing:.06em;text-align:center}

  .levels{
    position:absolute;left:14px;bottom:14px;z-index:5;
    display:flex;gap:8px;padding:6px;border-radius:999px;
    background:rgba(0,0,0,.38);backdrop-filter:blur(6px);
  }
  .levels button{
    width:26px;height:26px;border-radius:50%;padding:0;cursor:pointer;
    border:2px solid transparent;box-shadow:0 0 0 1px rgba(0,0,0,.35);
    touch-action:manipulation;
  }
  .levels button[aria-pressed="true"]{border-color:#fff}
  .levels.na{opacity:.35;pointer-events:none}
  .levels{opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .18s ease,transform .18s ease}
  .levels.show{opacity:1;pointer-events:auto;transform:none}
  .levels.show.na{opacity:.35;pointer-events:none}
  .chip,.stage{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .hint{
    position:absolute;left:50%;bottom:58px;transform:translateX(-50%);
    z-index:5;pointer-events:none;
    font-size:11.5px;color:rgba(255,255,255,.72);
    background:rgba(0,0,0,.4);
    padding:6px 12px;border-radius:999px;
    backdrop-filter:blur(6px);
    white-space:normal;text-align:center;line-height:1.4;
    width:max-content;max-width:calc(100% - 28px);
    transition:opacity .4s ease;
  }
  .hint.off{opacity:0}

  /* ---------- console ---------- */
  .console{
    flex:none;z-index:6;
    background:var(--ink);
    padding:14px 0 max(12px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:11px;
  }
  .tabs{display:flex;gap:6px;padding:0 14px}
  .tab{
    flex:1;appearance:none;cursor:pointer;
    background:transparent;color:var(--fg-dim);
    border:1px solid transparent;border-radius:8px;
    font-family:var(--sans);font-size:13px;font-weight:400;
    padding:7px 4px;
    transition:color .15s ease,background .15s ease;
  }
  .tab[aria-selected="true"]{color:var(--fg);background:var(--ink-2);border-color:var(--line)}
  .tab:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

  .strip{
    display:flex;gap:9px;
    padding:2px 14px 4px;
    overflow-x:auto;
    scrollbar-width:none;
    scroll-snap-type:x proximity;
  }
  .strip::-webkit-scrollbar{display:none}
  .chip{
    flex:none;width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(255,255,255,.22);
    cursor:pointer;padding:0;
    scroll-snap-align:center;
    position:relative;
    transition:transform .16s ease;
  }
  .chip[aria-pressed="true"]{
    transform:scale(1.06);
    box-shadow:0 0 0 2px var(--ink),0 0 0 3.5px var(--fg);
  }
  .chip:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
  .chip.saved::after{
    content:"";position:absolute;right:-1px;bottom:-1px;
    width:11px;height:11px;border-radius:50%;
    background:var(--fg);border:2px solid var(--ink);
  }

  .actions{display:flex;gap:8px;padding:0 14px;align-items:center}
  .btn{
    appearance:none;cursor:pointer;
    background:var(--ink-2);color:var(--fg);
    border:1px solid var(--line);border-radius:9px;
    font-family:var(--sans);font-size:12.5px;font-weight:400;
    padding:9px 12px;
    display:inline-flex;align-items:center;gap:6px;
    transition:border-color .15s ease,color .15s ease;
    touch-action:manipulation;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--line-strong)}
  .btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  .btn[aria-pressed="true"]{border-color:var(--fg)}
  .btn .num{font-family:var(--mono);font-size:11.5px;color:var(--fg-dim)}
  .btn.wide{flex:1;justify-content:center}
  .btn.hold:active{background:#26262b}

  /* ---------- saved sheet ---------- */
  .sheet{
    position:absolute;inset:0;z-index:20;
    background:rgba(8,8,10,.86);
    backdrop-filter:blur(14px);
    display:flex;flex-direction:column;
    padding:22px 20px max(20px,env(safe-area-inset-bottom));
    gap:16px;overflow-y:auto;
  }
  .sheet[hidden]{display:none!important}
  .sheet h2{font-family:var(--serif);font-size:22px;font-weight:400;margin:0}
  .sheet .lede{margin:-8px 0 0;font-size:12.5px;line-height:1.65;color:var(--fg-dim);max-width:48ch}
  .group{display:flex;flex-direction:column;gap:8px}
  .group h3{
    margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--fg-dim);font-weight:500;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .group h3 b{font-family:var(--mono);font-weight:400;letter-spacing:0;color:var(--fg)}
  .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--ink-2)}
  .bar i{display:block}
  .savedlist{display:flex;flex-wrap:wrap;gap:7px}
  .savedlist button{
    appearance:none;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
    background:var(--ink-2);border:1px solid var(--line);
    border-radius:999px;padding:5px 11px 5px 6px;
    color:var(--fg);font-family:var(--sans);font-size:12px;
  }
  .savedlist button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  .savedlist i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
  .empty{font-size:12.5px;color:var(--fg-dim)}

  /* ---------- camera fallback ---------- */
  .fallback{
    position:absolute;inset:0;z-index:10;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:28px;
    background:var(--ink-2);
  }
  .stage.blocked .fallback{display:flex}
  .fallback p{margin:0;font-size:13px;line-height:1.7;color:var(--fg-dim);max-width:34ch}
  .fallback .t{font-family:var(--serif);font-size:19px;color:var(--fg)}
  #file{display:none}

  /* ---------- 처음 안내 팝업 ---------- */
  .intro{
    position:fixed;inset:0;z-index:50;
    background:rgba(0,0,0,.72);backdrop-filter:blur(8px);
    display:flex;align-items:flex-end;justify-content:center;
    padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));
  }
  .intro[hidden]{display:none}
  .intro .card{
    width:100%;max-width:480px;
    background:linear-gradient(180deg,#1E1C24 0%,#151419 100%);
    border:1px solid rgba(255,255,255,.1);border-radius:30px;
    padding:26px 22px 20px;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
    animation:introUp .5s cubic-bezier(.2,.9,.3,1.15);
  }
  @keyframes introUp{from{transform:translateY(40px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .intro h2{margin:0 0 20px;font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
  .intro h2 small{display:block;font-size:13px;font-weight:400;color:var(--fg-dim);margin-top:4px;letter-spacing:0}
  .intro ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
  .intro li{
    display:flex;gap:14px;align-items:center;
    background:rgba(255,255,255,.04);border-radius:20px;padding:12px 14px;
  }
  .intro .n{
    flex:none;width:44px;height:44px;border-radius:16px;
    display:grid;place-items:center;font-size:22px;line-height:1;
    background:#FFE7B8;
  }
  .intro li:nth-child(2) .n{background:#E6DBFF}
  .intro li:nth-child(3) .n{background:#FFD9E2}
  .intro b{display:block;font-weight:600;font-size:15px;margin-bottom:3px;letter-spacing:-.01em}
  .intro p{margin:0;font-size:13px;line-height:1.5;color:var(--fg-dim)}
  .intro .note{margin:16px 6px 0;font-size:12px;line-height:1.5;color:rgba(255,255,255,.5);text-align:center}
  .intro .go{
    margin-top:18px;width:100%;padding:15px;border-radius:999px;border:0;
    background:linear-gradient(90deg,#FF9A8B,#FFB88C);color:#1A1216;
    font-family:var(--sans);font-size:15.5px;font-weight:600;cursor:pointer;letter-spacing:-.01em;
    box-shadow:0 8px 24px rgba(255,140,120,.28);
    transition:transform .12s ease;
  }
  .intro .go:active{transform:scale(.98)}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
  @media (min-width:760px){
    .app{max-width:520px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  }
</style>
</head>
<body>

<div class="app">
  <div class="stage" id="stage">
    <video id="cam" autoplay playsinline muted></video>
    <img id="shot" alt="업로드한 사진">

    <div class="guide" id="guide"></div>

    <div class="drape" id="drape">
      <svg class="neck" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,0 H27 C34,21 66,21 73,0 H100 V20 H0 Z"></path>
      </svg>
      <div class="body"></div>
    </div>
    <button class="handle" id="handle" aria-label="드레이프 높이 조절"><span></span></button>

    <div class="readout">
      <div>
        <div class="name" id="cName">코랄</div>
        <div class="season" id="cSeason">봄 웜 · 밝고 맑은 · 노란기</div>
      </div>
      <div class="meta">
        <button class="flip" id="flipTop" type="button" hidden aria-label="카메라 전환"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.5"/><path d="M20 20v-4h-4"/></svg><span id="flipTopText" hidden></span></button>
        <div id="cHex">#FF7F6E</div>
        <div class="match na" id="cMatchWrap" hidden title="같은 조명에서 다른 색과 견준 상대값입니다"><b id="cMatch">—</b><span>어울림</span></div>
      </div>
    </div>

    <div class="levels" id="levels" role="group">
      <button type="button" data-lv="0"></button><button type="button" data-lv="1"></button><button type="button" data-lv="2"></button>
    </div>

    <div class="hint" id="hint">좌우로 밀어 색을 넘기세요 · 손잡이를 끌면 드레이프 높이</div>

    <div class="fallback">
      <div class="t" id="fbTitle">카메라를 열 수 없어요</div>
      <p id="fbMsg">브라우저에서 카메라 권한을 허용하거나, 사진 한 장으로 대신 진행할 수 있어요.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <a class="btn" id="openExt" href="#" target="_blank" rel="noopener">브라우저에서 열기</a>
        <button class="btn" id="retry">다시 시도</button>
        <button class="btn" id="pick">사진 올리기</button>
      </div>
      <input type="file" id="file" accept="image/*">
    </div>
  </div>

  <div class="console">
    <div class="keptbar" id="keptBar" hidden><span><b id="keptTitle">담은 색끼리 비교</b> <span id="keptCount"></span></span><button class="btn" id="keptExit" type="button">전체 색 보기</button></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="strip" id="strip"></div>
    <div class="strip" id="keptStrip" hidden></div>
    <div class="actions">
      <button class="btn hold" id="compare">직전 색 비교<span class="num" id="prevHex">—</span></button>
      <button class="btn wide" id="save">이 색 담기</button>
      <button class="btn" id="openSaved">담은 색<span class="num" id="savedCount">0</span></button>
      <button class="btn" id="menuBtn" aria-label="더보기">⋯</button>
    </div>
  </div>

  <div class="intro" id="intro" hidden role="dialog" aria-modal="true" aria-labelledby="introTitle">
    <div class="card">
      <h2><span id="introTitle"></span><small id="introSub"></small></h2>
      <ol>
        <li><span class="n">☀️</span><div><b id="i1t"></b><p id="i1p"></p></div></li>
        <li><span class="n">🪞</span><div><b id="i2t"></b><p id="i2p"></p></div></li>
        <li><span class="n">💛</span><div><b id="i3t"></b><p id="i3p"></p></div></li>
      </ol>
      <p class="note" id="introNote"></p>
      <button class="go" id="introGo" type="button"></button>
    </div>
  </div>

  <div class="sheet menu" id="menu" hidden>
    <h2 id="menuTitle">더보기</h2>
    <div class="rows">
      <button class="mrow" id="flipBtn" type="button" hidden><span id="flipLabel">카메라</span><span class="state" id="flipState"></span></button>
      <button class="mrow" id="lockBtn" type="button" hidden aria-pressed="false"><span id="lockLabel">빛 고정</span><span class="state" id="lockState"></span></button>
      <button class="mrow" id="guideBtn" type="button" aria-pressed="true"><span id="guideLabel">얼굴 가이드</span><span class="state" id="guideState"></span></button>
      <button class="mrow" id="langBtn" type="button"><span id="langLabel">언어</span><span class="state" id="langState"></span></button>
      <button class="mrow" id="helpBtn" type="button"><span id="helpLabel">사용법</span><span class="state">›</span></button>
      <a class="mrow" id="privacyLink" href="privacy.html"><span id="privacyLabel">개인정보처리방침</span><span class="state">›</span></a>
    </div>
    <div class="actions" style="padding:0">
      <button class="btn wide" id="closeMenu">닫기</button>
    </div>
    <div class="ver" id="ver"></div>
  </div>

  <div class="sheet" id="sheet" hidden>
    <h2 id="sheetTitle">담은 색</h2>
    <p class="lede" id="lede">얼굴빛이 맑아 보였던 색만 담으세요. 한 계절에 몰린다면 그쪽이 유력합니다. 다만 조명이 바뀌면 결과도 바뀌니, 다른 날 자연광에서 한 번 더 해보고 겹치는지 확인하세요.</p>

  /* ---- 어울림 지수 ----
     얼굴 가이드 안(볼·코 부근)의 피부색을 카메라에서 읽어 Lab 색공간으로 바꾸고,
     32색 각각에 대해 (1) 피부 언더톤과 색의 온도 일치, (2) 피부의 맑기와 색의 채도 일치를 점수화한다.
     절대값이 아니라 32색 안에서의 상대 순위를 10~100으로 펼친 값이다.
     조명이 바뀌면 피부색 측정이 통째로 움직이므로, 같은 자리·같은 조명에서 색끼리 견주는 용도로만 쓴다. */
  var skin = null;           // {L,a,b,C,h} 이동평균
  var matchScores = null;    // FLAT 순서의 10~100 점수
  function srgbToLab(r,g,b){
    function lin(v){ v/=255; return v<=0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }
    var R=lin(r),G=lin(g),B=lin(b);
    var X=(R*0.4124+G*0.3576+B*0.1805)/0.95047, Y=(R*0.2126+G*0.7152+B*0.0722), Z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
    function f(t){ return t>0.008856 ? Math.cbrt(t) : 7.787*t+16/116; }
    var fx=f(X),fy=f(Y),fz=f(Z);
    return { L:116*fy-16, a:500*(fx-fy), b:200*(fy-fz) };
  }
  function polar(lab){
    lab.C=Math.sqrt(lab.a*lab.a+lab.b*lab.b);
    lab.h=(Math.atan2(lab.b,lab.a)*180/Math.PI+360)%360;
    return lab;
  }
  var LABS = FLAT.map(function(c){
    var n=parseInt(c.h.slice(1),16);
    return polar(srgbToLab((n>>16)&255,(n>>8)&255,n&255));
  });
  var CMAX = Math.max.apply(null, LABS.map(function(l){ return l.C; }));
  function colorWarmth(l){ // -1(쿨) ~ +1(웜). 무채색은 0
    var w = Math.cos((l.h-60)*Math.PI/180);
    return w * Math.min(1, l.C/30);
  }
  function computeScores(){
    if(!skin) { matchScores=null; return; }
    // 피부 언더톤: Lab 색상각이 클수록 노란기(웜). 52°를 중립으로, ±12°를 ±1로 본다 — 관행적 범위에서 정한 값.
    var skinWarm = Math.max(-1, Math.min(1, (skin.h-52)/12));
    // 피부 맑기: 채도 12~35를 0~1로
    var skinClear = Math.max(0, Math.min(1, (skin.C-12)/23));
    var raw = LABS.map(function(l){
      var temp = 1 - Math.abs(skinWarm - colorWarmth(l))/2;        // 0~1
      var clear = 1 - Math.abs(skinClear - l.C/CMAX);              // 0~1
      return 0.6*temp + 0.4*clear;
    });
    var lo=Math.min.apply(null,raw), hi=Math.max.apply(null,raw);
    matchScores = raw.map(function(v){ return hi>lo ? Math.round(10 + 90*(v-lo)/(hi-lo)) : 55; });
  }
  function showMatch(i){
    if(i===undefined) i=idx;
    var w=$("cMatchWrap"), b=$("cMatch");
    if(!matchScores){ w.classList.add("na"); b.textContent="—"; return; }
    w.classList.remove("na"); b.textContent=matchScores[i]+"%";
  }
  var sampCv=document.createElement("canvas"); sampCv.width=24; sampCv.height=24;
  var sampCx=sampCv.getContext("2d",{willReadFrequently:true});
  function sampleSkin(){
    var src, sw, sh;
    if(stage.classList.contains("photo")){ src=$("shot"); sw=src.naturalWidth; sh=src.naturalHeight; }
    else { src=video; sw=video.videoWidth; sh=video.videoHeight; }
    if(!sw || !sh || stage.classList.contains("blocked")) return false;
    var r=stage.getBoundingClientRect(), W=r.width, H=r.height;
    var gw=Math.min(0.56*W,240), gh=gw*4/3;               // .guide 크기와 동일
    var cx=W/2, cy=0.2*H+gh/2+0.12*gh;                    // 가이드 중심보다 살짝 아래 = 볼·코
    var bw=0.4*gw, bh=0.25*gh;
    var scale=Math.max(W/sw, H/sh), ox=(W-sw*scale)/2, oy=(H-sh*scale)/2;   // object-fit:cover 역산
    var x=(cx-bw/2-ox)/scale, y=(cy-bh/2-oy)/scale, w=bw/scale, h=bh/scale;
    try{ sampCx.drawImage(src, x, y, w, h, 0, 0, 24, 24); }catch(e){ return false; }
    var d=sampCx.getImageData(0,0,24,24).data, Ls=[],As=[],Bs=[];
    for(var i=0;i<d.length;i+=4){
      var lab=srgbToLab(d[i],d[i+1],d[i+2]);
      if(lab.L<18 || lab.L>96) continue;                  // 눈썹·눈동자·반사광 제외
      Ls.push(lab.L); As.push(lab.a); Bs.push(lab.b);
    }
    if(Ls.length<60) return false;
    function med(a){ a.sort(function(p,q){return p-q;}); return a[a.length>>1]; }
    var m={L:med(Ls),a:med(As),b:med(Bs)};
    if(!skin) skin=m; else { skin.L+= .3*(m.L-skin.L); skin.a+= .3*(m.a-skin.a); skin.b+= .3*(m.b-skin.b); }
    polar(skin);
    return true;
  }
  if(MATCH_ENABLED){
    $("cMatchWrap").hidden = false;
    setInterval(function(){
      if(sampleSkin()) computeScores(); else { skin=null; matchScores=null; }
      if(!flashing) showMatch();
    }, 700);
  }

  /* ---- 빛 고정 (화이트밸런스·노출 잠금) ----
     폰 카메라는 장면에 맞춰 색온도와 밝기를 계속 다시 맞춘다. 드레이프 색이 바뀌거나 고개를 돌리면
     얼굴색도 따라 흔들려 비교가 어렵다. 기기가 허용하면(안드로이드 Chrome 대부분) 현재 값에 고정한다.
     iOS Safari는 이 API를 지원하지 않아 버튼이 숨겨진다. */
  var lightLocked = false, camTrack = null;
  function setupLightLock(stream){
    camTrack = stream.getVideoTracks()[0];
    lightLocked = false;
    var caps = {};
    try{ caps = camTrack.getCapabilities ? camTrack.getCapabilities() : {}; }catch(e){}
    var canWB = caps.whiteBalanceMode && caps.whiteBalanceMode.indexOf("manual") > -1;
    var canEx = caps.exposureMode && caps.exposureMode.indexOf("manual") > -1;
    $("lockBtn").hidden = !(canWB || canEx);
    $("lockBtn").setAttribute("aria-pressed","false");
    $("lockState").textContent = t("off");
  }
  function setLightLock(on){
    if(!camTrack) return Promise.resolve();
    var caps = {}, st = {};
    try{ caps = camTrack.getCapabilities(); st = camTrack.getSettings(); }catch(e){}
    var adv = {};
    if(caps.whiteBalanceMode && caps.whiteBalanceMode.indexOf("manual") > -1){
      adv.whiteBalanceMode = on ? "manual" : "continuous";
      if(on && st.colorTemperature) adv.colorTemperature = st.colorTemperature;
    }
    if(caps.exposureMode && caps.exposureMode.indexOf("manual") > -1){
      adv.exposureMode = on ? "manual" : "continuous";
      if(on && st.exposureTime) adv.exposureTime = st.exposureTime;
      if(on && st.iso) adv.iso = st.iso;
    }
    return camTrack.applyConstraints({ advanced:[adv] }).then(function(){
      lightLocked = on;
    }).catch(function(){
      // 노출 고정이 거부되면 화이트밸런스만이라도
      var wb = {};
      if(adv.whiteBalanceMode){ wb.whiteBalanceMode = adv.whiteBalanceMode; if(adv.colorTemperature) wb.colorTemperature = adv.colorTemperature; }
      return camTrack.applyConstraints({ advanced:[wb] }).then(function(){ lightLocked = on; }).catch(function(){});
    }).then(function(){
      $("lockBtn").setAttribute("aria-pressed", lightLocked ? "true" : "false");
      $("lockState").textContent = lightLocked ? t("on") : t("off");
    });
  }
  $("lockBtn").addEventListener("click", function(){ setLightLock(!lightLocked); });

    applyLang();
  });

  /* ---- 처음 안내 ---- 한 번 닫으면 다시 안 뜬다. 우측 상단 ? 로 다시 볼 수 있다. */
  var introSeen = false;
  try{ introSeen = localStorage.getItem("drape.intro") === "1"; }catch(e){}
  function showIntro(){ $("intro").hidden = false; $("introGo").focus(); }
  $("introGo").addEventListener("click", function(){
    $("intro").hidden = true;
    try{ localStorage.setItem("drape.intro","1"); }catch(e){}
  });
  $("helpBtn").addEventListener("click", function(){ $("menu").hidden = true; showIntro(); });
  $("menuBtn").addEventListener("click", function(){ applyLang(); $("menu").hidden = false; });
  $("closeMenu").addEventListener("click", function(){ $("menu").hidden = true; });
  if(!introSeen) showIntro();

  applyLang();
  startCam();
  $("ver").textContent = "v" + APP_VERSION;

  /* ---- PWA ---- */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
    // 새 서비스워커가 주도권을 잡으면 한 번만 새로고침 → 앱을 두 번 열지 않아도 새 버전이 보인다.
    // 첫 설치(이전 controller 없음)에는 새로고침하지 않는다.
    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(hadController && !reloaded){ reloaded = true; location.reload(); }
    });
  }
})();
</script>

</body>
</html>
