<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="카메라에 비친 얼굴에 사계절 드레이프 색을 대보는 퍼스널컬러 미러">
<title>톤미러</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D0D0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="톤미러">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap"></noscript>
<style>
  :root{
    --ink:#0D0D0F;
    --ink-2:#161619;
    --fg:#F3F2EF;
    --fg-dim:#9B99A2;
    --line:rgba(255,255,255,.14);
    --line-strong:rgba(255,255,255,.32);
    --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --serif:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
    --drape:#FF7F6E;
    --drape-top:52%;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--ink);
    color:var(--fg);
    font-family:var(--sans);
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  .app{
    position:relative;
    width:100%;
    height:100dvh;
    min-height:520px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:var(--ink);
  }

  /* ---------- stage: camera + drape ---------- */
  .stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--ink-2);touch-action:pan-y}
  #cam,#shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  #cam{transform:scaleX(-1)}
  #shot{display:none}
  .stage.photo #cam{display:none}
  .stage.photo #shot{display:block}

  .drape{
    position:absolute;left:0;right:0;top:var(--drape-top);bottom:0;
    display:flex;flex-direction:column;
    filter:drop-shadow(0 -14px 22px rgba(0,0,0,.45));
    z-index:2;
  }
  .drape .neck{display:block;width:100%;height:76px;flex:none}
  .drape .neck path{fill:var(--drape)}
  .drape .body{flex:1;background:var(--drape);min-height:0}

  .handle{
    position:absolute;left:50%;top:calc(var(--drape-top) + 46px);
    transform:translateX(-50%);
    z-index:4;
    width:104px;height:34px;
    display:flex;align-items:center;justify-content:center;
    border:0;padding:0;background:none;cursor:grab;
    touch-action:none;
  }
  .handle:active{cursor:grabbing}
  .handle span{
    width:44px;height:4px;border-radius:2px;
    background:rgba(255,255,255,.55);
    box-shadow:0 0 0 1px rgba(0,0,0,.25);
  }

  .guide{
    position:absolute;left:50%;top:20%;transform:translateX(-50%);
    width:min(56vw,240px);aspect-ratio:3/4;
    border:1px dashed var(--line-strong);
    border-radius:50%;
    z-index:3;pointer-events:none;
    transition:opacity .25s ease;
  }
  .guide.off{opacity:0}

  /* ---------- readout ---------- */
  .readout{
    position:absolute;top:0;left:0;right:0;z-index:5;
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
    padding:16px 18px 40px;
    background:linear-gradient(to bottom,rgba(0,0,0,.62),rgba(0,0,0,0));
    pointer-events:none;
  }
  .readout .name{font-family:var(--serif);font-size:26px;line-height:1.15;letter-spacing:-.01em}
  .readout .season{
    margin-top:5px;font-size:11.5px;letter-spacing:.02em;
    color:var(--fg-dim);
  }
  .readout .meta{text-align:right;font-family:var(--mono);font-size:12px;letter-spacing:.02em}
  .readout .match{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--fg-dim);display:flex;align-items:baseline;justify-content:flex-end;gap:6px}
  .readout .match b{font-weight:500;font-size:22px;color:var(--fg);letter-spacing:-.02em;min-width:2.4em;text-align:right}
  .readout .match.na b{color:var(--fg-dim)}
  .readout .ver{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:rgba(255,255,255,.38);letter-spacing:.06em}

  .hint{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    z-index:5;pointer-events:none;
    font-size:11.5px;color:rgba(255,255,255,.72);
    background:rgba(0,0,0,.4);
    padding:6px 12px;border-radius:999px;
    backdrop-filter:blur(6px);
    white-space:nowrap;
    transition:opacity .4s ease;
  }
  .hint.off{opacity:0}

  /* ---------- console ---------- */
  .console{
    flex:none;z-index:6;
    background:var(--ink);
    border-top:1px solid var(--line);
    padding:12px 0 max(12px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:11px;
  }
  .tabs{display:flex;gap:6px;padding:0 14px}
  .tab{
    flex:1;appearance:none;cursor:pointer;
    background:transparent;color:var(--fg-dim);
    border:1px solid transparent;border-radius:8px;
    font-family:var(--sans);font-size:13px;font-weight:400;
    padding:7px 4px;
    transition:color .15s ease,background .15s ease;
  }
  .tab[aria-selected="true"]{color:var(--fg);background:var(--ink-2);border-color:var(--line)}
  .tab:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

  .strip{
    display:flex;gap:9px;
    padding:2px 14px 4px;
    overflow-x:auto;
    scrollbar-width:none;
    scroll-snap-type:x proximity;
  }
  .strip::-webkit-scrollbar{display:none}
  .chip{
    flex:none;width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(255,255,255,.22);
    cursor:pointer;padding:0;
    scroll-snap-align:center;
    position:relative;
    transition:transform .16s ease;
  }
  .chip[aria-pressed="true"]{
    transform:scale(1.06);
    box-shadow:0 0 0 2px var(--ink),0 0 0 3.5px var(--fg);
  }
  .chip:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
  .chip.saved::after{
    content:"";position:absolute;right:-1px;bottom:-1px;
    width:11px;height:11px;border-radius:50%;
    background:var(--fg);border:2px solid var(--ink);
  }

  .actions{display:flex;gap:8px;padding:0 14px;align-items:center}
  .btn{
    appearance:none;cursor:pointer;
    background:var(--ink-2);color:var(--fg);
    border:1px solid var(--line);border-radius:9px;
    font-family:var(--sans);font-size:12.5px;font-weight:400;
    padding:9px 12px;
    display:inline-flex;align-items:center;gap:6px;
    transition:border-color .15s ease,color .15s ease;
    touch-action:manipulation;
    white-space:nowrap;
  }
  @media (max-width:420px){ #compare .num{display:none} }
  .btn:hover{border-color:var(--line-strong)}
  .btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  .btn[aria-pressed="true"]{border-color:var(--fg)}
  .btn .num{font-family:var(--mono);font-size:11.5px;color:var(--fg-dim)}
  .btn.wide{flex:1;justify-content:center}
  .btn.hold:active{background:#26262b}

  /* ---------- saved sheet ---------- */
  .sheet{
    position:absolute;inset:0;z-index:20;
    background:rgba(8,8,10,.86);
    backdrop-filter:blur(14px);
    display:flex;flex-direction:column;
    padding:22px 20px max(20px,env(safe-area-inset-bottom));
    gap:16px;overflow-y:auto;
  }
  .sheet[hidden]{display:none!important}
  .sheet h2{font-family:var(--serif);font-size:22px;font-weight:400;margin:0}
  .sheet .lede{margin:-8px 0 0;font-size:12.5px;line-height:1.65;color:var(--fg-dim);max-width:48ch}
  .group{display:flex;flex-direction:column;gap:8px}
  .group h3{
    margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--fg-dim);font-weight:500;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .group h3 b{font-family:var(--mono);font-weight:400;letter-spacing:0;color:var(--fg)}
  .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--ink-2)}
  .bar i{display:block}
  .savedlist{display:flex;flex-wrap:wrap;gap:7px}
  .savedlist button{
    appearance:none;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
    background:var(--ink-2);border:1px solid var(--line);
    border-radius:999px;padding:5px 11px 5px 6px;
    color:var(--fg);font-family:var(--sans);font-size:12px;
  }
  .savedlist button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  .savedlist i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
  .empty{font-size:12.5px;color:var(--fg-dim)}

  /* ---------- camera fallback ---------- */
  .fallback{
    position:absolute;inset:0;z-index:10;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:28px;
    background:var(--ink-2);
  }
  .stage.blocked .fallback{display:flex}
  .fallback p{margin:0;font-size:13px;line-height:1.7;color:var(--fg-dim);max-width:34ch}
  .fallback .t{font-family:var(--serif);font-size:19px;color:var(--fg)}
  #file{display:none}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
  @media (min-width:760px){
    .app{max-width:520px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  }
</style>
</head>
<body>

<div class="app">
  <div class="stage" id="stage">
    <video id="cam" autoplay playsinline muted></video>
    <img id="shot" alt="업로드한 사진">

    <div class="guide" id="guide"></div>

    <div class="drape" id="drape">
      <svg class="neck" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,0 H27 C34,21 66,21 73,0 H100 V20 H0 Z"></path>
      </svg>
      <div class="body"></div>
    </div>
    <button class="handle" id="handle" aria-label="드레이프 높이 조절"><span></span></button>

    <div class="readout">
      <div>
        <div class="name" id="cName">코랄</div>
        <div class="season" id="cSeason">봄 웜 · 밝고 맑은 · 노란기</div>
      </div>
      <div class="meta">
        <div id="cHex">#FF7F6E</div>
        <div class="match na" id="cMatchWrap" title="같은 조명에서 다른 색과 견준 상대값입니다"><b id="cMatch">—</b><span>어울림</span></div>
        <div class="ver" id="ver"></div>
      </div>
    </div>

    <div class="hint" id="hint">좌우로 밀어 색을 넘기세요 · 손잡이를 끌면 드레이프 높이</div>

    <div class="fallback">
      <div class="t">카메라를 열 수 없어요</div>
      <p id="fbMsg">브라우저에서 카메라 권한을 허용하거나, 사진 한 장으로 대신 진행할 수 있어요.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <a class="btn" id="openExt" href="#" target="_blank" rel="noopener">브라우저에서 열기</a>
        <button class="btn" id="retry">다시 시도</button>
        <button class="btn" id="pick">사진 올리기</button>
      </div>
      <input type="file" id="file" accept="image/*">
    </div>
  </div>

  <div class="console">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="strip" id="strip"></div>
    <div class="actions">
      <button class="btn hold" id="compare">직전 색 비교<span class="num" id="prevHex">—</span></button>
      <button class="btn" id="guideBtn" aria-pressed="true">가이드</button>
      <button class="btn wide" id="save">이 색 담기</button>
      <button class="btn" id="openSaved">담은 색<span class="num" id="savedCount">0</span></button>
    </div>
  </div>

  <div class="sheet" id="sheet" hidden>
    <h2>담은 색</h2>
    <p class="lede">얼굴빛이 맑아 보였던 색만 담으세요. 한 계절에 몰린다면 그쪽이 유력합니다. 다만 조명이 바뀌면 결과도 바뀌니, 다른 날 자연광에서 한 번 더 해보고 겹치는지 확인하세요.</p>
    <div id="tally"></div>
    <div class="group">
      <h3>목록</h3>
      <div class="savedlist" id="savedList"></div>
    </div>
    <div class="actions" style="padding:0">
      <button class="btn wide" id="closeSheet">돌아가기</button>
      <button class="btn" id="clearSaved">전체 지우기</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var APP_VERSION = "6"; // 화면에 표시. sw.js의 VERSION 숫자와 함께 올린다

  var SEASONS = [
    { key:"spring", ko:"봄 웜", en:"Spring Warm", attr:"밝고 맑은 · 노란기", colors:[
      {n:"코랄",h:"#FF7F6E"},{n:"피치",h:"#FFB088"},{n:"골든 옐로",h:"#FFD23D"},{n:"애플 그린",h:"#8CC63F"},
      {n:"아쿠아",h:"#3FC1C9"},{n:"살몬 핑크",h:"#FF8FA3"},{n:"카멜",h:"#D99A5B"},{n:"아이보리",h:"#FFF3D6"}]},
    { key:"summer", ko:"여름 쿨", en:"Summer Cool", attr:"부드럽고 흐린 · 푸른기", colors:[
      {n:"라벤더",h:"#B39DDB"},{n:"파우더 블루",h:"#A8C8E8"},{n:"로즈 핑크",h:"#E7A0B8"},{n:"소프트 민트",h:"#9FD8C8"},
      {n:"그레이시 블루",h:"#7E9AB8"},{n:"모브",h:"#A98BA5"},{n:"소프트 네이비",h:"#4A5D7E"},{n:"라이트 그레이",h:"#D6D3DC"}]},
    { key:"autumn", ko:"가을 웜", en:"Autumn Warm", attr:"깊고 흐린 · 노란기", colors:[
      {n:"머스터드",h:"#D4A017"},{n:"테라코타",h:"#C05F3C"},{n:"올리브",h:"#7A8450"},{n:"카키 브라운",h:"#8B6F47"},
      {n:"펌킨",h:"#C25E27"},{n:"포레스트",h:"#3E5C4B"},{n:"브릭 와인",h:"#8E3B37"},{n:"크림 베이지",h:"#E8D5B0"}]},
    { key:"winter", ko:"겨울 쿨", en:"Winter Cool", attr:"선명하고 진한 · 푸른기", colors:[
      {n:"퓨어 화이트",h:"#FFFFFF"},{n:"트루 블랙",h:"#1A1A1A"},{n:"로열 블루",h:"#1E50A2"},{n:"마젠타",h:"#C71585"},
      {n:"에메랄드",h:"#00876C"},{n:"아이시 핑크",h:"#F2C6D9"},{n:"버건디",h:"#7B1E3A"},{n:"코발트",h:"#2B3A8F"}]}
  ];

  // flat index across all seasons
  var FLAT = [];
  SEASONS.forEach(function(s,si){
    s.colors.forEach(function(c,ci){ FLAT.push({si:si,ci:ci,n:c.n,h:c.h,s:s}); });
  });

  var root = document.documentElement;
  var $ = function(id){ return document.getElementById(id); };
  var stage=$("stage"), strip=$("strip"), tabs=$("tabs");
  var idx = 0, prevIdx = null, saved = [], drapeTop = 52;

  try{
    var raw = localStorage.getItem("drape.saved");
    if(raw) saved = JSON.parse(raw) || [];
  }catch(e){ saved = []; }

  function persist(){
    try{ localStorage.setItem("drape.saved", JSON.stringify(saved)); }catch(e){}
  }

  /* ---- build controls ---- */
  SEASONS.forEach(function(s,si){
    var b=document.createElement("button");
    b.className="tab"; b.type="button"; b.role="tab"; b.textContent=s.ko;
    b.addEventListener("click", function(){ setIdx(si*8); });
    tabs.appendChild(b);
  });

  FLAT.forEach(function(c,i){
    var b=document.createElement("button");
    b.className="chip"; b.type="button";
    b.style.background=c.h;
    b.title=c.s.ko+" · "+c.n;
    b.setAttribute("aria-label", c.s.ko+" "+c.n);
    b.addEventListener("click", function(){ setIdx(i); });
    strip.appendChild(b);
  });
  var chips = strip.querySelectorAll(".chip");
  var tabEls = tabs.querySelectorAll(".tab");

  function setIdx(i, keepPrev){
    var n = FLAT.length;
    i = ((i % n) + n) % n;
    if(i === idx) return;
    if(!keepPrev) prevIdx = idx;
    idx = i;
    render();
    chips[idx].scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
    hideHint();
  }

  function render(){
    var c = FLAT[idx];
    root.style.setProperty("--drape", c.h);
    $("cName").textContent = c.n;
    $("cSeason").textContent = c.s.ko + " · " + c.s.attr;
    $("cHex").textContent = c.h;
    showMatch();
    $("prevHex").textContent = prevIdx===null ? "—" : FLAT[prevIdx].h;
    for(var i=0;i<chips.length;i++){
      chips[i].setAttribute("aria-pressed", i===idx ? "true" : "false");
      chips[i].classList.toggle("saved", saved.indexOf(FLAT[i].h) > -1);
    }
    for(var t=0;t<tabEls.length;t++){
      tabEls[t].setAttribute("aria-selected", t===c.si ? "true" : "false");
    }
    $("save").textContent = saved.indexOf(c.h) > -1 ? "담기 취소" : "이 색 담기";
    $("savedCount").textContent = String(saved.length);
  }

  /* ---- drape height ---- */
  function setTop(pct){
    drapeTop = Math.max(24, Math.min(82, pct));
    root.style.setProperty("--drape-top", drapeTop + "%");
  }
  setTop(drapeTop);

  var dragging=false;
  var handle=$("handle");
  handle.addEventListener("pointerdown", function(e){
    dragging=true; handle.setPointerCapture(e.pointerId); e.preventDefault();
  });
  handle.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var r = stage.getBoundingClientRect();
    setTop(((e.clientY - r.top - 46) / r.height) * 100);
    hideHint();
  });
  ["pointerup","pointercancel"].forEach(function(ev){
    handle.addEventListener(ev, function(){ dragging=false; });
  });

  /* ---- swipe on stage ---- */
  var sx=null, sy=null;
  stage.addEventListener("pointerdown", function(e){
    if(e.target.closest("#handle") || e.target.closest(".fallback")) return;
    sx=e.clientX; sy=e.clientY;
  });
  stage.addEventListener("pointerup", function(e){
    if(sx===null) return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    sx=null;
    if(Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) setIdx(idx + (dx<0 ? 1 : -1));
  });

  /* ---- keyboard ---- */
  document.addEventListener("keydown", function(e){
    if(e.target.tagName==="INPUT") return;
    if(e.key==="ArrowRight"){ setIdx(idx+1); e.preventDefault(); }
    else if(e.key==="ArrowLeft"){ setIdx(idx-1); e.preventDefault(); }
    else if(e.key==="ArrowDown"){ setIdx((FLAT[idx].si+1)*8); e.preventDefault(); }
    else if(e.key==="ArrowUp"){ setIdx((FLAT[idx].si+3)*8); e.preventDefault(); }
    else if(e.key===" " && prevIdx!==null && !e.repeat){ flash(true); e.preventDefault(); }
  });
  document.addEventListener("keyup", function(e){
    if(e.key===" ") flash(false);
  });

  /* ---- hold to compare ---- */
  var flashing=false;
  function flash(on){
    if(prevIdx===null) return;
    if(on && !flashing){ flashing=true; root.style.setProperty("--drape", FLAT[prevIdx].h); $("cName").textContent = FLAT[prevIdx].n; $("cHex").textContent = FLAT[prevIdx].h; showMatch(prevIdx); }
    else if(!on && flashing){ flashing=false; render(); }
  }
  var cmp=$("compare");
  ["pointerdown"].forEach(function(ev){ cmp.addEventListener(ev, function(e){ e.preventDefault(); flash(true); }); });
  ["pointerup","pointerleave","pointercancel"].forEach(function(ev){ cmp.addEventListener(ev, function(){ flash(false); }); });

  /* ---- guide + hint ---- */
  var guideOn=true;
  $("guideBtn").addEventListener("click", function(){
    guideOn=!guideOn;
    $("guide").classList.toggle("off", !guideOn);
    this.setAttribute("aria-pressed", guideOn ? "true" : "false");
  });
  var hintTimer = setTimeout(hideHint, 7000);
  function hideHint(){ clearTimeout(hintTimer); $("hint").classList.add("off"); }

  /* ---- save ---- */
  $("save").addEventListener("click", function(){
    var h = FLAT[idx].h, at = saved.indexOf(h);
    if(at > -1) saved.splice(at,1); else saved.push(h);
    persist(); render();
  });

  $("openSaved").addEventListener("click", function(){ renderSheet(); $("sheet").hidden=false; });
  $("closeSheet").addEventListener("click", function(){ $("sheet").hidden=true; });
  $("clearSaved").addEventListener("click", function(){ saved=[]; persist(); render(); renderSheet(); });

  function renderSheet(){
    var tally=$("tally"), list=$("savedList");
    tally.innerHTML=""; list.innerHTML="";
    if(!saved.length){
      var p=document.createElement("div");
      p.className="empty"; p.textContent="아직 담은 색이 없어요. 색을 넘기다가 얼굴이 화사해 보이는 색에서 ‘이 색 담기’를 누르세요.";
      list.appendChild(p);
      return;
    }
    var counts = SEASONS.map(function(){ return 0; });
    saved.forEach(function(h){
      var f = FLAT.filter(function(c){ return c.h===h; })[0];
      if(f) counts[f.si]++;
    });
    var g=document.createElement("div");
    g.className="group";
    var h3=document.createElement("h3");
    h3.innerHTML='<span>계절 분포</span><b>'+saved.length+'색</b>';
    g.appendChild(h3);
    var bar=document.createElement("div");
    bar.className="bar";
    SEASONS.forEach(function(s,si){
      if(!counts[si]) return;
      var i=document.createElement("i");
      i.style.width=(counts[si]/saved.length*100)+"%";
      i.style.background=s.colors[0].h;
      i.title=s.ko+" "+counts[si];
      bar.appendChild(i);
    });
    g.appendChild(bar);
    var legend=document.createElement("div");
    legend.style.cssText="display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--fg-dim)";
    SEASONS.forEach(function(s,si){
      var sp=document.createElement("span");
      sp.textContent=s.ko+" "+counts[si];
      if(counts[si] && counts[si]===Math.max.apply(null,counts)) sp.style.color="var(--fg)";
      legend.appendChild(sp);
    });
    g.appendChild(legend);
    tally.appendChild(g);

    saved.forEach(function(h){
      var f = FLAT.filter(function(c){ return c.h===h; })[0];
      if(!f) return;
      var b=document.createElement("button");
      b.type="button";
      b.innerHTML='<i style="background:'+h+'"></i>'+f.n;
      b.addEventListener("click", function(){
        setIdx(FLAT.indexOf(f));
        $("sheet").hidden=true;
      });
      list.appendChild(b);
    });
  }

  /* ---- 어울림 지수 ----
     얼굴 가이드 안(볼·코 부근)의 피부색을 카메라에서 읽어 Lab 색공간으로 바꾸고,
     32색 각각에 대해 (1) 피부 언더톤과 색의 온도 일치, (2) 피부의 맑기와 색의 채도 일치를 점수화한다.
     절대값이 아니라 32색 안에서의 상대 순위를 10~100으로 펼친 값이다.
     조명이 바뀌면 피부색 측정이 통째로 움직이므로, 같은 자리·같은 조명에서 색끼리 견주는 용도로만 쓴다. */
  var skin = null;           // {L,a,b,C,h} 이동평균
  var matchScores = null;    // FLAT 순서의 10~100 점수
  function srgbToLab(r,g,b){
    function lin(v){ v/=255; return v<=0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }
    var R=lin(r),G=lin(g),B=lin(b);
    var X=(R*0.4124+G*0.3576+B*0.1805)/0.95047, Y=(R*0.2126+G*0.7152+B*0.0722), Z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
    function f(t){ return t>0.008856 ? Math.cbrt(t) : 7.787*t+16/116; }
    var fx=f(X),fy=f(Y),fz=f(Z);
    return { L:116*fy-16, a:500*(fx-fy), b:200*(fy-fz) };
  }
  function polar(lab){
    lab.C=Math.sqrt(lab.a*lab.a+lab.b*lab.b);
    lab.h=(Math.atan2(lab.b,lab.a)*180/Math.PI+360)%360;
    return lab;
  }
  var LABS = FLAT.map(function(c){
    var n=parseInt(c.h.slice(1),16);
    return polar(srgbToLab((n>>16)&255,(n>>8)&255,n&255));
  });
  var CMAX = Math.max.apply(null, LABS.map(function(l){ return l.C; }));
  function colorWarmth(l){ // -1(쿨) ~ +1(웜). 무채색은 0
    var w = Math.cos((l.h-60)*Math.PI/180);
    return w * Math.min(1, l.C/30);
  }
  function computeScores(){
    if(!skin) { matchScores=null; return; }
    // 피부 언더톤: Lab 색상각이 클수록 노란기(웜). 52°를 중립으로, ±12°를 ±1로 본다 — 관행적 범위에서 정한 값.
    var skinWarm = Math.max(-1, Math.min(1, (skin.h-52)/12));
    // 피부 맑기: 채도 12~35를 0~1로
    var skinClear = Math.max(0, Math.min(1, (skin.C-12)/23));
    var raw = LABS.map(function(l){
      var temp = 1 - Math.abs(skinWarm - colorWarmth(l))/2;        // 0~1
      var clear = 1 - Math.abs(skinClear - l.C/CMAX);              // 0~1
      return 0.6*temp + 0.4*clear;
    });
    var lo=Math.min.apply(null,raw), hi=Math.max.apply(null,raw);
    matchScores = raw.map(function(v){ return hi>lo ? Math.round(10 + 90*(v-lo)/(hi-lo)) : 55; });
  }
  function showMatch(i){
    if(i===undefined) i=idx;
    var w=$("cMatchWrap"), b=$("cMatch");
    if(!matchScores){ w.classList.add("na"); b.textContent="—"; return; }
    w.classList.remove("na"); b.textContent=matchScores[i]+"%";
  }
  var sampCv=document.createElement("canvas"); sampCv.width=24; sampCv.height=24;
  var sampCx=sampCv.getContext("2d",{willReadFrequently:true});
  function sampleSkin(){
    var src, sw, sh;
    if(stage.classList.contains("photo")){ src=$("shot"); sw=src.naturalWidth; sh=src.naturalHeight; }
    else { src=video; sw=video.videoWidth; sh=video.videoHeight; }
    if(!sw || !sh || stage.classList.contains("blocked")) return false;
    var r=stage.getBoundingClientRect(), W=r.width, H=r.height;
    var gw=Math.min(0.56*W,240), gh=gw*4/3;               // .guide 크기와 동일
    var cx=W/2, cy=0.2*H+gh/2+0.12*gh;                    // 가이드 중심보다 살짝 아래 = 볼·코
    var bw=0.4*gw, bh=0.25*gh;
    var scale=Math.max(W/sw, H/sh), ox=(W-sw*scale)/2, oy=(H-sh*scale)/2;   // object-fit:cover 역산
    var x=(cx-bw/2-ox)/scale, y=(cy-bh/2-oy)/scale, w=bw/scale, h=bh/scale;
    try{ sampCx.drawImage(src, x, y, w, h, 0, 0, 24, 24); }catch(e){ return false; }
    var d=sampCx.getImageData(0,0,24,24).data, Ls=[],As=[],Bs=[];
    for(var i=0;i<d.length;i+=4){
      var lab=srgbToLab(d[i],d[i+1],d[i+2]);
      if(lab.L<18 || lab.L>96) continue;                  // 눈썹·눈동자·반사광 제외
      Ls.push(lab.L); As.push(lab.a); Bs.push(lab.b);
    }
    if(Ls.length<60) return false;
    function med(a){ a.sort(function(p,q){return p-q;}); return a[a.length>>1]; }
    var m={L:med(Ls),a:med(As),b:med(Bs)};
    if(!skin) skin=m; else { skin.L+= .3*(m.L-skin.L); skin.a+= .3*(m.a-skin.a); skin.b+= .3*(m.b-skin.b); }
    polar(skin);
    return true;
  }
  setInterval(function(){
    if(sampleSkin()) computeScores(); else { skin=null; matchScores=null; }
    if(!flashing) showMatch();
  }, 700);

  /* ---- camera ---- */
  var video=$("cam");
  function startCam(){
    stage.classList.remove("blocked");
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      return fail("이 브라우저에서는 카메라를 쓸 수 없어요. 사진 한 장으로 대신 진행할 수 있어요.");
    }
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:960} }, audio:false })
      .then(function(s){ stage.classList.remove("photo"); video.srcObject=s; })
      .catch(function(err){
        var framed = false;
        try{ framed = window.top !== window.self; }catch(e){ framed = true; }
        fail(err && err.name==="NotAllowedError"
          ? (framed
              ? "앱 안의 미리보기에서는 카메라가 막혀 있어요. ‘브라우저에서 열기’로 Chrome이나 삼성 인터넷에서 열면 권한을 물어봅니다."
              : "카메라 권한이 거부됐어요. 주소창 왼쪽 자물쇠 → 권한 → 카메라를 허용하고 ‘다시 시도’를 누르세요.")
          : "카메라를 찾지 못했어요. 사진 한 장으로 대신 진행할 수 있어요.");
      });
  }
  function fail(msg){ $("fbMsg").textContent=msg; stage.classList.add("blocked"); }

  $("retry").addEventListener("click", startCam);
  $("openExt").href = location.href;
  try{ if(window.top === window.self) $("openExt").hidden = true; }catch(e){}
  $("pick").addEventListener("click", function(){ $("file").click(); });
  $("file").addEventListener("change", function(){
    var f=this.files && this.files[0];
    if(!f) return;
    $("shot").src=URL.createObjectURL(f);
    stage.classList.add("photo");
    stage.classList.remove("blocked");
  });

  render();
  startCam();
  $("ver").textContent = "v" + APP_VERSION;

  /* ---- PWA ---- */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
    // 새 서비스워커가 주도권을 잡으면 한 번만 새로고침 → 앱을 두 번 열지 않아도 새 버전이 보인다.
    // 첫 설치(이전 controller 없음)에는 새로고침하지 않는다.
    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(hadController && !reloaded){ reloaded = true; location.reload(); }
    });
  }
})();
</script>

</body>
</html>
